[package]
name = "jj-fetch"
version = "0.1.0"
edition = "2024"
description = "Fetch all remotes of every Jujutsu repository in a directory, periodically while on AC power"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
# A panic on any thread should stop the daemon, so that launchd restarts it, rather than leave it
# half-working.
panic = "abort"
